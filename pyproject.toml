[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tar-swarm"
version = "0.1.0"
description = "Shared Python environment for university aerial swarm robotics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[project.optional-dependencies]
planning = [
  "shapely>=2.0",
  "pydantic>=2.0",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "tensorboard>=2.14",
]

[project.scripts]
tar-plan = "tar_swarm.mission_planning.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Preserve the earlier manual-flight experiment; new Step 0 code is fully linted.
"models/mujoco/hover.py" = ["E501", "I001"]

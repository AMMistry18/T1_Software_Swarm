name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone network dependencies
        run: python -m pip install -r requirements-network.txt pytest
      - name: Test network simulator without MuJoCo
        run: python -m pytest -q tests/test_network.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Lint
        run: python -m ruff check .
      - name: Test headless simulation
        run: python -m pytest
